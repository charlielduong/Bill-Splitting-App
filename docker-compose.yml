services:
  divi-client:
    build:
      context: .
      dockerfile: divi_client/Dockerfile
    container_name: divi-client
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EXPO_PUBLIC_SUPABASE_URL: ${EXPO_PUBLIC_SUPABASE_URL:-http://127.0.0.1:54321}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${EXPO_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "8083:8083"
    volumes:
      - .:/app
      - divi_client_node_modules:/app/node_modules
    working_dir: /app
    command: npm run web -- --host 0.0.0.0 --port 8083

volumes:
  divi_client_node_modules:
